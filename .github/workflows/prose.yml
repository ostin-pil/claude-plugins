# Prose gate for the marketplace's own user-facing docs. Runs the bundled
# prose-mint action over changed markdown on every PR. Scope and the enabled
# category set come from .prose-mint.toml at the repo root, so the same rules
# apply to a local `prose-mint bulk` walk and to CI.
#
# The action lives at ./prose-mint (it is the prose-mint plugin's package
# root), so this dogfoods the action from the same checkout that ships it: a
# change to action.yml is gated by that same action.yml on the PR.
#
# `on: pull_request` with no `types:` means opened, synchronize and reopened,
# so editing a PR body does NOT re-run this and a stale failure stays on the
# PR. Re-run the job by hand rather than pushing an empty commit: the body scan
# fetches title and body live with `gh pr view`, not from the event payload, so
# a re-run sees the edit.
name: prose
on:
  pull_request:
jobs:
  prose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./prose-mint
        with:
          strict: "true"
          # The docs in scope wrap at ~80 columns by choice, so hard-wrap stays
          # off in .prose-mint.toml. A PR body is the other medium: GitHub's
          # comment pipeline turns a single newline into a line break, so the
          # same wrapping renders ragged there. Scan the body with the built-in
          # ruleset, which has hard-wrap on.
          pr-body-config: "default"
