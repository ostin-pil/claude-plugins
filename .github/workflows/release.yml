# Publish prose-mint to PyPI on a version tag.
#
# Uses PyPI Trusted Publishing (OIDC), so no API token is stored. One-time
# setup on pypi.org for the prose-mint project (Manage -> Publishing):
#   PyPI Project Name: prose-mint
#   Owner:             ostin-pil
#   Repository:        claude-plugins
#   Workflow name:     release.yml
#   Environment:       pypi
#
# Cut a release by tagging: git tag prose-mint-v0.1.1 && git push origin prose-mint-v0.1.1
name: release
on:
  push:
    tags:
      - "prose-mint-v*"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#prose-mint-v}"
          PKG_VERSION=$(grep -oE '__version__ = "[^"]+"' prose-mint/prose_mint/__init__.py | grep -oE '[0-9][^"]*')
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag version $TAG_VERSION does not match package version $PKG_VERSION"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build --outdir dist prose-mint
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
