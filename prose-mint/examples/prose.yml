# Drop this into any repo at .github/workflows/prose.yml. The whole gate is
# one `uses:` stanza; scope and rules come from that repo's .prose-mint.toml.
# The action is the prose-mint package root inside the public claude-plugins
# monorepo.
name: prose
on:
  pull_request:
jobs:
  prose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ostin-pil/claude-plugins/prose-mint@main
        # with:
        #   strict: "true"          # fail the build on any hit
        #   scan-pr-body: "false"   # skip the PR title+body scan
        #   config: ".prose-mint.toml"
