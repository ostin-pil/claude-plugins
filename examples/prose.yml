# Drop this into any repo at .github/workflows/prose.yml. The whole gate is
# one `uses:` stanza; scope and rules come from that repo's .prose-mint.toml.
# The action lives in the private repo ostin-pil/ProseMint; the consumer
# repo must have access (same-owner private-action sharing, or make the
# action repo accessible). "ProseMint" is the provisional GitHub repo name;
# the tool, CLI, and plugin are still "prose-mint".
name: prose
on:
  pull_request:
jobs:
  prose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ostin-pil/ProseMint@v1
        # with:
        #   strict: "true"          # fail the build on any hit
        #   scan-pr-body: "false"   # skip the PR title+body scan
        #   config: ".prose-mint.toml"
