[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prose-lint"
version = "0.1.0"
description = "Structural-tells linter for AI-flavored prose"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
prose-lint = "prose_lint.cli:main"

[tool.setuptools]
packages = ["prose_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
